name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          STATUS=0
          for f in *.sh; do
            [ -f "$f" ] || continue
            shellcheck -s sh "$f" || STATUS=1
          done
          for f in common/*.sh tests/*.sh; do
            [ -f "$f" ] || continue
            shellcheck -s sh "$f" || STATUS=1
          done
          exit $STATUS

  zip:
    name: Build & verify zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build zip
        run: make zip

      - name: Verify zip was created
        run: ls adb_root-v*.zip

      - name: Verify expected files are present
        run: |
          ZIP=$(ls adb_root-v*.zip)
          for f in module.prop service.sh customize.sh common/default_config.sh \
                   system.prop sepolicy.rule uninstall.sh \
                   system/bin/adbd.arm64 system/bin/adbd.arm \
                   system/bin/adbd.x86 system/bin/adbd.x86_64 \
                   META-INF/com/google/android/update-binary \
                   META-INF/com/google/android/updater-script; do
            unzip -l "$ZIP" | grep -q "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "All expected files present"

      - name: Verify excluded files are absent
        run: |
          ZIP=$(ls adb_root-v*.zip)
          for f in .gitignore CLAUDE.md .claude/ .git/ .github/ Makefile LICENSE \
                   README.md CHANGELOG.md update.json cliff.toml hooks/ \
                   Dockerfile build-adbd.sh patches/ tests/; do
            if unzip -l "$ZIP" | grep -q "$f"; then
              echo "UNEXPECTED: $f found in zip"
              exit 1
            fi
          done
          echo "No excluded files in zip"

      - name: Verify module.prop has required fields
        run: |
          for field in id name version versionCode; do
            grep -q "^${field}=" module.prop || { echo "MISSING field: $field"; exit 1; }
          done
          echo "All required fields present"

  build-adbd:
    name: Build adbd (${{ matrix.arch }})
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'build-adbd')
    strategy:
      matrix:
        arch: [arm64, arm, x86, x86_64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build adbd binary
        run: >-
          DOCKER_BUILDKIT=1 docker build
          --build-arg TARGET_ARCH=${{ matrix.arch }}
          --target=binary --output=type=local,dest=out/ .

      - name: Install QEMU user-static
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Verify binary
        run: ./tests/test-adbd-binary.sh out/adbd ${{ matrix.arch }}

      - name: Upload adbd artifact
        uses: actions/upload-artifact@v4
        with:
          name: adbd-${{ matrix.arch }}
          path: out/adbd
          retention-days: 7
