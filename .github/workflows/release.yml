name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Validate & publish release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Version consistency check
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PROP_VER=$(grep '^version=' module.prop | cut -d'=' -f2)
          if [ "$TAG" != "$PROP_VER" ]; then
            echo "ERROR: Tag ($TAG) does not match module.prop version ($PROP_VER)"
            exit 1
          fi
          if ! grep -q "^## ${TAG}$" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md missing section for ${TAG}"
            exit 1
          fi
          echo "Version consistent: $TAG"

      - name: Check update-binary freshness
        run: |
          make update
          if ! git diff --quiet META-INF/com/google/android/update-binary; then
            echo "ERROR: update-binary is outdated — run 'make update' and commit"
            exit 1
          fi

      - name: Verify updater-script
        run: |
          CONTENT=$(cat META-INF/com/google/android/updater-script)
          if [ "$CONTENT" != "#MAGISK" ]; then
            echo "ERROR: updater-script must contain only '#MAGISK'"
            exit 1
          fi
          echo "updater-script OK"

      - name: Build zip
        run: make zip

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ github.ref_name }} --strip all
        env:
          OUTPUT: /tmp/release-notes.md

      - name: Generate update.json
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d'=' -f2)
          VERSION_CODE=$(grep '^versionCode=' module.prop | cut -d'=' -f2)
          ID=$(grep '^id=' module.prop | cut -d'=' -f2)
          TAG="${GITHUB_REF#refs/tags/}"
          REPO="${GITHUB_REPOSITORY}"
          cat > update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "version": "${VERSION}",
            "zipUrl": "https://github.com/${REPO}/releases/download/${TAG}/${ID}-${VERSION}.zip",
            "changelog": "https://github.com/${REPO}/releases/tag/${TAG}"
          }
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            adb_root-v*.zip \
            update.json
